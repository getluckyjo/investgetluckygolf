<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Poster Gothic"; src: url("../assets/fonts/PosterGothicRoundATF-Heavy.woff2") format("woff2"); font-weight: 800; }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #0c160e; font-family: Inter, sans-serif; color: #f5eede; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 68% 55%; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,22,14,.95) 0%, rgba(12,22,14,.82) 50%, rgba(12,22,14,.45) 100%), linear-gradient(0deg, rgba(12,22,14,.85) 0%, rgba(12,22,14,0) 45%); }
.copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 690px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.logo { height: 64px; width: auto; display: block; margin-bottom: 30px; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: #d6fb4b; color: #345231; font-weight: 700; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: #345231; display: block; }
h1 { font-family: "Poster Gothic"; font-weight: 800; text-transform: uppercase; font-size: 62px; line-height: .95; margin-top: 28px; white-space: nowrap; letter-spacing: .005em; }
h1 span { color: #d6fb4b; }
.three { margin-top: 28px; font-size: 24px; font-weight: 600; color: rgba(245,238,222,.92); }
.three b { color: #d6fb4b; font-weight: 700; padding: 0 8px; }
.ernie { position: absolute; right: 64px; top: 70px; width: 360px; height: 470px; border-radius: 28px; overflow: hidden; border: 1px solid rgba(245,238,222,.18); box-shadow: 0 40px 80px -30px rgba(0,0,0,.8); }
.ernie img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.ernie span { position: absolute; left: 14px; top: 14px; padding: 7px 14px; border-radius: 999px; background: rgba(12,22,14,.75); font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.foot { margin-top: 22px; font-size: 18px; color: rgba(245,238,222,.65); letter-spacing: .02em; }
</style></head><body><div class="card">
<img class="bg" src="../assets/img/hero-metropolitan-2000.webp">
<div class="shade"></div>
<div class="copy">
  <img class="logo" src="../assets/logos/logo-dark-bg.webp">
  <span class="chip"><i></i>Investor briefing · 2027</span>
  <h1>Golf's biggest shot<br><span>goes global.</span></h1>
  <p class="three">On course<b>·</b>On Golfzon simulators<b>·</b>In the gym</p>
  <p class="foot">Private briefing · password required</p>
</div>
<div class="ernie"><img src="../assets/img/ernie-ace.webp"><span>Ernie Els · Founding Ambassador</span></div>
</div></body></html>
