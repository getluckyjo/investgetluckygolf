<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-label="A driving range at night, with ball-tracer arcs landing on three target greens">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3120"/>
      <stop offset="1" stop-color="#0c160e"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4d2c"/>
      <stop offset=".55" stop-color="#1e3120"/>
      <stop offset="1" stop-color="#0c160e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".55" cy=".2" r=".55">
      <stop offset="0" stop-color="#d6fb4b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d6fb4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tracer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d6fb4b" stop-opacity=".1"/>
      <stop offset=".6" stop-color="#d6fb4b" stop-opacity=".85"/>
      <stop offset="1" stop-color="#d6fb4b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1000" fill="url(#sky)"/>
  <path d="M0 150 H900 V1000 H0 Z" fill="url(#turf)"/>
  <rect width="900" height="1000" fill="url(#glow)"/>
  <!-- lane lines, converging on the horizon -->
  <g stroke="#f5eede" stroke-opacity=".07" stroke-width="2" fill="none">
    <path d="M450 140 L-350 1000"/><path d="M450 140 L60 1000"/><path d="M450 140 L450 1000"/>
    <path d="M450 140 L840 1000"/><path d="M450 140 L1250 1000"/>
  </g>
  <!-- distance boards across the range -->
  <g stroke="#f5eede" stroke-opacity=".1" stroke-width="1.5" stroke-dasharray="6 10">
    <path d="M0 196 H900"/><path d="M0 272 H900"/><path d="M0 392 H900"/><path d="M0 580 H900"/>
  </g>
  <!-- target greens: far, middle, near -->
  <g>
    <ellipse cx="560" cy="196" rx="74" ry="13" fill="#4a7a3d" fill-opacity=".55"/>
    <ellipse cx="560" cy="196" rx="44" ry="8" fill="none" stroke="#f5eede" stroke-opacity=".35" stroke-width="2"/>
    <ellipse cx="300" cy="272" rx="112" ry="20" fill="#4a7a3d" fill-opacity=".6"/>
    <ellipse cx="300" cy="272" rx="66" ry="12" fill="none" stroke="#f5eede" stroke-opacity=".35" stroke-width="2"/>
    <ellipse cx="640" cy="392" rx="160" ry="30" fill="#4a7a3d" fill-opacity=".65"/>
    <ellipse cx="640" cy="392" rx="96" ry="18" fill="none" stroke="#f5eede" stroke-opacity=".35" stroke-width="2.5"/>
  </g>
  <!-- flags -->
  <g stroke="#f5eede" stroke-width="2.5">
    <path d="M560 196 V160"/><path d="M300 272 V222"/><path d="M640 392 V326"/>
  </g>
  <g fill="#d6fb4b">
    <path d="M560 160 l18 6 -18 6 z"/><path d="M300 222 l24 8 -24 8 z"/><path d="M640 326 l30 10 -30 10 z"/>
  </g>
  <!-- distances -->
  <g font-family="Inter, Arial, sans-serif" font-weight="700" fill="#f5eede" fill-opacity=".55" letter-spacing="2">
    <text x="652" y="200" font-size="18">200 M</text>
    <text x="430" y="278" font-size="20">150 M</text>
    <text x="820" y="398" font-size="22" text-anchor="end">100 M</text>
  </g>
  <!-- ball tracers from the bay to each green -->
  <g fill="none" stroke="url(#tracer)" stroke-linecap="round">
    <path d="M450 1000 Q478 -120 560 192" stroke-width="5"/>
    <path d="M450 1000 Q356 -20 302 268" stroke-width="5"/>
    <path d="M450 1000 Q560 60 636 388" stroke-width="6"/>
  </g>
  <g fill="#d6fb4b">
    <circle cx="560" cy="192" r="6"/><circle cx="302" cy="268" r="7"/><circle cx="636" cy="388" r="8"/>
  </g>
  <g fill="#d6fb4b" fill-opacity=".25">
    <circle cx="560" cy="192" r="14"/><circle cx="302" cy="268" r="16"/><circle cx="636" cy="388" r="19"/>
  </g>
</svg>
